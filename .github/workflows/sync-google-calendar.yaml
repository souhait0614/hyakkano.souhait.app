name: Sync Google Calendar

on:
  push:
    branches:
      - main
    paths:
      - 'data/characters/**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-checkout:
    name: Pre checkout
    uses: ./.github/workflows/pre-checkout.yaml

  sync:
    name: Sync birthdays to Google Calendar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - pre-checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.pre-checkout.outputs.sha }}
          fetch-depth: 1

      - name: Setup tools
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Sync Google Calendar
        run: pnpm tsx scripts/sync-google-calendar.ts
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_IDS: ${{ vars.GOOGLE_CALENDAR_IDS }}
          SITE_HOSTNAME: ${{ vars.SITE_HOSTNAME }}
